{% extends "auth_base.html" %}
{% block title %}Login · {{ config.SITE_NAME }}{% endblock %}
{% block content %}
<form method="POST" action="{{ url_for('auth.login') }}">
  <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

  <div class="form-group">
    <label class="form-label">Email</label>
    <input type="email" name="email" class="form-control"
           placeholder="you@example.com" required autocomplete="email">
  </div>

  <div class="form-group">
    <label class="form-label">Password</label>
    <input type="password" name="password" class="form-control"
           placeholder="••••••••" required autocomplete="current-password">
  </div>

  <div class="flex items-center justify-between mb-2" style="font-size:.82rem">
    <label style="display:flex;align-items:center;gap:.4rem;cursor:pointer;color:var(--text2)">
      <input type="checkbox" name="remember"> Remember me
    </label>
  </div>

  <button type="submit" class="btn btn-primary w-full">
    <i class="fa fa-right-to-bracket"></i> Sign In
  </button>
</form>

<div class="divider"></div>

<p style="text-align:center;font-size:.82rem;color:var(--text3)">
  Don't have an account?
  <a href="{{ url_for('auth.register') }}" style="color:var(--purple2);text-decoration:none">Register</a>
</p>
{% endblock %}
