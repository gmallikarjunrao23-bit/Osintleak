{% extends "auth_base.html" %}
{% block title %}Register · {{ config.SITE_NAME }}{% endblock %}
{% block content %}
<form method="POST" action="{{ url_for('auth.register') }}">

  <div class="form-group">
    <label class="form-label">Full Name</label>
    <input type="text" name="full_name" class="form-control"
           placeholder="Your name" required autocomplete="name">
  </div>

  <div class="form-group">
    <label class="form-label">Email</label>
    <input type="email" name="email" class="form-control"
           placeholder="you@example.com" required autocomplete="email">
  </div>

  <div class="form-group">
    <label class="form-label">Password <span style="color:var(--text3);font-size:.75rem">(min 6 chars)</span></label>
    <input type="password" name="password" class="form-control"
           placeholder="••••••••" required minlength="6" autocomplete="new-password">
  </div>

  <div class="form-group">
    <label class="form-label">Referral Code <span style="color:var(--text3)">(optional)</span></label>
    <input type="text" name="referral" class="form-control"
           placeholder="XXXXXXXX" style="text-transform:uppercase">
  </div>

  <button type="submit" class="btn btn-primary w-full">
    <i class="fa fa-user-plus"></i> Create Account
  </button>
</form>

<div class="divider"></div>

<p style="text-align:center;font-size:.82rem;color:var(--text3)">
  Already have an account?
  <a href="{{ url_for('auth.login') }}" style="color:var(--purple2);text-decoration:none">Login</a>
</p>
{% endblock %}
