<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}{{ config.SITE_NAME }}{% endblock %}</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <style>
/* OSINT 100X ULTIMATE — Premium Dark Glassmorphism */
@import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;600;700;900&family=Inter:wght@300;400;500;600&display=swap');

:root {
  --bg:        #06060f;
  --bg2:       #0a0a18;
  --glass:     rgba(255,255,255,0.04);
  --glass2:    rgba(255,255,255,0.07);
  --border:    rgba(255,255,255,0.08);
  --border2:   rgba(255,255,255,0.14);
  --purple:    #7c3aed;
  --purple2:   #9f67ff;
  --cyan:      #06b6d4;
  --cyan2:     #22d3ee;
  --green:     #10b981;
  --red:       #ef4444;
  --yellow:    #f59e0b;
  --text:      #e2e8f0;
  --text2:     #94a3b8;
  --text3:     #64748b;
  --sidebar-w: 260px;
  --radius:    14px;
  --radius-sm: 8px;
}

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

html { scroll-behavior: smooth; }

body {
  font-family: 'Inter', sans-serif;
  background: var(--bg);
  color: var(--text);
  min-height: 100vh;
  line-height: 1.6;
  overflow-x: hidden;
}

/* ── BACKGROUND ORBS ───────────────────────────────────── */
body::before {
  content: '';
  position: fixed;
  inset: 0;
  background:
    radial-gradient(ellipse 60% 40% at 15% 20%, rgba(124,58,237,.12) 0%, transparent 70%),
    radial-gradient(ellipse 50% 50% at 85% 80%, rgba(6,182,212,.08) 0%, transparent 70%);
  pointer-events: none;
  z-index: 0;
}

/* ── LAYOUT ─────────────────────────────────────────────── */
.app-layout {
  display: grid;
  grid-template-columns: var(--sidebar-w) 1fr;
  min-height: 100vh;
  position: relative;
  z-index: 1;
}

.main-content {
  padding: 2rem 2.5rem;
  overflow-y: auto;
  min-height: 100vh;
}

/* ── SIDEBAR ─────────────────────────────────────────────── */
.sidebar {
  position: fixed;
  top: 0; left: 0;
  height: 100vh;
  width: var(--sidebar-w);
  background: rgba(10,10,24,0.85);
  backdrop-filter: blur(20px);
  border-right: 1px solid var(--border);
  display: flex;
  flex-direction: column;
  z-index: 100;
  overflow-y: auto;
}

.sidebar-brand {
  padding: 1.5rem 1.25rem 1rem;
  border-bottom: 1px solid var(--border);
}

.brand-logo {
  font-family: 'Orbitron', sans-serif;
  font-weight: 900;
  font-size: 1.1rem;
  background: linear-gradient(135deg, var(--purple2), var(--cyan));
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  letter-spacing: .04em;
  display: flex;
  align-items: center;
  gap: .5rem;
}

.brand-sub {
  font-size: .7rem;
  color: var(--text3);
  margin-top: .15rem;
  letter-spacing: .12em;
  text-transform: uppercase;
}

.sidebar-nav { flex: 1; padding: 1rem 0; }

.nav-section-label {
  font-size: .65rem;
  font-weight: 600;
  color: var(--text3);
  text-transform: uppercase;
  letter-spacing: .12em;
  padding: .75rem 1.25rem .25rem;
}

.nav-link {
  display: flex;
  align-items: center;
  gap: .75rem;
  padding: .6rem 1.25rem;
  color: var(--text2);
  text-decoration: none;
  font-size: .875rem;
  font-weight: 500;
  border-radius: 0;
  transition: all .2s;
  position: relative;
}

.nav-link:hover {
  color: var(--text);
  background: var(--glass2);
}

.nav-link.active {
  color: var(--purple2);
  background: rgba(124,58,237,.1);
}

.nav-link.active::before {
  content: '';
  position: absolute;
  left: 0; top: 0; bottom: 0;
  width: 3px;
  background: linear-gradient(var(--purple), var(--cyan));
  border-radius: 0 2px 2px 0;
}

.nav-link i { width: 18px; text-align: center; font-size: .9rem; }

.sidebar-footer {
  padding: 1rem 1.25rem;
  border-top: 1px solid var(--border);
}

.user-card {
  display: flex;
  align-items: center;
  gap: .75rem;
}

.user-avatar {
  width: 36px; height: 36px;
  border-radius: 50%;
  border: 2px solid var(--purple);
  object-fit: cover;
  flex-shrink: 0;
}

.user-info { min-width: 0; flex: 1; }

.user-name {
  font-size: .8rem;
  font-weight: 600;
  color: var(--text);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.user-email {
  font-size: .7rem;
  color: var(--text3);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.logout-btn {
  background: none;
  border: none;
  color: var(--text3);
  cursor: pointer;
  padding: .25rem;
  transition: color .2s;
  flex-shrink: 0;
}
.logout-btn:hover { color: var(--red); }

/* ── CARDS ───────────────────────────────────────────────── */
.card {
  background: var(--glass);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  backdrop-filter: blur(12px);
  padding: 1.5rem;
  transition: border-color .2s, transform .2s;
}

.card:hover { border-color: var(--border2); }

.card-glow {
  box-shadow: 0 0 0 1px var(--purple) inset,
              0 4px 24px rgba(124,58,237,.15);
}

/* ── STAT CARDS ─────────────────────────────────────────── */
.stats-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
  gap: 1rem;
  margin-bottom: 2rem;
}

.stat-card {
  background: var(--glass);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 1.25rem;
  display: flex;
  align-items: center;
  gap: 1rem;
  transition: all .2s;
}

.stat-card:hover {
  border-color: var(--border2);
  transform: translateY(-2px);
}

.stat-icon {
  width: 44px; height: 44px;
  border-radius: var(--radius-sm);
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 1.25rem;
  flex-shrink: 0;
}

.stat-icon.purple { background: rgba(124,58,237,.2); }
.stat-icon.cyan   { background: rgba(6,182,212,.2); }
.stat-icon.green  { background: rgba(16,185,129,.2); }
.stat-icon.yellow { background: rgba(245,158,11,.2); }
.stat-icon.red    { background: rgba(239,68,68,.2); }

.stat-value {
  font-family: 'Orbitron', sans-serif;
  font-size: 1.5rem;
  font-weight: 700;
  line-height: 1;
  background: linear-gradient(135deg, #fff, var(--text2));
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
}

.stat-label {
  font-size: .75rem;
  color: var(--text3);
  margin-top: .2rem;
}

/* ── PAGE HEADER ─────────────────────────────────────────── */
.page-header {
  margin-bottom: 2rem;
}

.page-title {
  font-family: 'Orbitron', sans-serif;
  font-size: 1.4rem;
  font-weight: 700;
  color: var(--text);
  letter-spacing: .03em;
}

.page-sub {
  color: var(--text3);
  font-size: .875rem;
  margin-top: .25rem;
}

/* ── SEARCH BOX ─────────────────────────────────────────── */
.search-container {
  position: relative;
  margin-bottom: 1.5rem;
}

.search-form {
  display: flex;
  gap: .75rem;
}

.search-input-wrap {
  position: relative;
  flex: 1;
}

.search-input {
  width: 100%;
  background: var(--glass2);
  border: 1px solid var(--border2);
  border-radius: var(--radius);
  color: var(--text);
  font-size: .95rem;
  padding: .9rem 1rem .9rem 3rem;
  outline: none;
  transition: all .2s;
  font-family: 'Inter', sans-serif;
}

.search-input:focus {
  border-color: var(--purple);
  box-shadow: 0 0 0 3px rgba(124,58,237,.15);
}

.search-input-icon {
  position: absolute;
  left: 1rem; top: 50%;
  transform: translateY(-50%);
  color: var(--text3);
  font-size: .9rem;
  pointer-events: none;
}

.btn {
  display: inline-flex;
  align-items: center;
  gap: .5rem;
  padding: .75rem 1.5rem;
  border-radius: var(--radius-sm);
  font-size: .875rem;
  font-weight: 600;
  border: none;
  cursor: pointer;
  text-decoration: none;
  transition: all .2s;
  white-space: nowrap;
}

.btn-primary {
  background: linear-gradient(135deg, var(--purple), var(--cyan));
  color: #fff;
  box-shadow: 0 4px 14px rgba(124,58,237,.35);
}

.btn-primary:hover {
  opacity: .9;
  transform: translateY(-1px);
  box-shadow: 0 6px 20px rgba(124,58,237,.45);
}

.btn-ghost {
  background: var(--glass2);
  border: 1px solid var(--border2);
  color: var(--text2);
}

.btn-ghost:hover {
  color: var(--text);
  background: rgba(255,255,255,.1);
}

.btn-danger {
  background: rgba(239,68,68,.15);
  border: 1px solid rgba(239,68,68,.3);
  color: #ef4444;
}

.btn-danger:hover { background: rgba(239,68,68,.25); }

.btn-success {
  background: rgba(16,185,129,.15);
  border: 1px solid rgba(16,185,129,.3);
  color: #10b981;
}
.btn-success:hover { background: rgba(16,185,129,.25); }

.btn-sm { padding: .4rem .9rem; font-size: .78rem; }

/* ── RESULTS ─────────────────────────────────────────────── */
.intel-summary {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
  gap: 1rem;
  margin-bottom: 2rem;
}

.intel-card {
  background: var(--glass);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 1.25rem;
}

.intel-card-title {
  font-size: .7rem;
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: .12em;
  color: var(--text3);
  margin-bottom: .75rem;
  display: flex;
  align-items: center;
  gap: .5rem;
}

.intel-item {
  font-size: .825rem;
  color: var(--cyan2);
  padding: .3rem 0;
  border-bottom: 1px solid var(--border);
  word-break: break-all;
  display: flex;
  align-items: center;
  gap: .5rem;
}

.intel-item:last-child { border-bottom: none; }

.intel-item.hash { color: var(--red); font-size: .75rem; font-family: monospace; }
.intel-item.phone { color: var(--green); }
.intel-item.email { color: var(--purple2); }
.intel-item.ip { color: var(--yellow); }

.source-block {
  background: var(--glass);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  margin-bottom: 1rem;
  overflow: hidden;
}

.source-header {
  padding: .9rem 1.25rem;
  background: var(--glass2);
  border-bottom: 1px solid var(--border);
  display: flex;
  align-items: center;
  justify-content: space-between;
  cursor: pointer;
  user-select: none;
}

.source-title {
  font-weight: 600;
  font-size: .9rem;
  display: flex;
  align-items: center;
  gap: .5rem;
}

.source-count {
  font-size: .75rem;
  background: rgba(124,58,237,.2);
  color: var(--purple2);
  padding: .15rem .6rem;
  border-radius: 20px;
}

.source-records { padding: 1rem 1.25rem; }

.record-card {
  background: rgba(0,0,0,.3);
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
  padding: 1rem;
  margin-bottom: .75rem;
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
  gap: .5rem;
}

.record-card:last-child { margin-bottom: 0; }

.record-field { font-size: .8rem; }

.record-label {
  color: var(--text3);
  font-size: .7rem;
  text-transform: uppercase;
  letter-spacing: .08em;
  margin-bottom: .1rem;
}

.record-value { color: var(--text); word-break: break-all; }

/* ── TABLES ──────────────────────────────────────────────── */
.table-wrap {
  overflow-x: auto;
  border-radius: var(--radius);
  border: 1px solid var(--border);
}

table {
  width: 100%;
  border-collapse: collapse;
  font-size: .85rem;
}

th {
  background: var(--glass2);
  padding: .75rem 1rem;
  text-align: left;
  font-size: .7rem;
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: .1em;
  color: var(--text3);
  border-bottom: 1px solid var(--border);
  white-space: nowrap;
}

td {
  padding: .75rem 1rem;
  border-bottom: 1px solid var(--border);
  color: var(--text2);
  vertical-align: middle;
}

tr:last-child td { border-bottom: none; }
tr:hover td { background: var(--glass2); }

/* ── BADGES ──────────────────────────────────────────────── */
.badge {
  display: inline-flex;
  align-items: center;
  gap: .3rem;
  padding: .2rem .6rem;
  border-radius: 20px;
  font-size: .72rem;
  font-weight: 600;
}

.badge-free       { background: rgba(107,114,128,.2); color: #9ca3af; }
.badge-premium    { background: rgba(124,58,237,.2);  color: #a78bfa; }
.badge-pro        { background: rgba(6,182,212,.2);   color: #67e8f9; }
.badge-enterprise { background: rgba(16,185,129,.2);  color: #6ee7b7; }
.badge-pending    { background: rgba(245,158,11,.2);  color: #fcd34d; }
.badge-approved   { background: rgba(16,185,129,.2);  color: #6ee7b7; }
.badge-rejected   { background: rgba(239,68,68,.2);   color: #fca5a5; }

/* ── FORMS ───────────────────────────────────────────────── */
.form-group { margin-bottom: 1.25rem; }

.form-label {
  display: block;
  font-size: .8rem;
  font-weight: 500;
  color: var(--text2);
  margin-bottom: .4rem;
}

.form-control {
  width: 100%;
  background: var(--glass2);
  border: 1px solid var(--border2);
  border-radius: var(--radius-sm);
  color: var(--text);
  font-size: .9rem;
  padding: .65rem .9rem;
  outline: none;
  transition: all .2s;
  font-family: 'Inter', sans-serif;
}

.form-control:focus {
  border-color: var(--purple);
  box-shadow: 0 0 0 3px rgba(124,58,237,.15);
}

.form-control option { background: #0a0a18; }

select.form-control { cursor: pointer; }

/* ── ALERTS ──────────────────────────────────────────────── */
.alert {
  padding: .75rem 1rem;
  border-radius: var(--radius-sm);
  font-size: .875rem;
  margin-bottom: 1rem;
  display: flex;
  align-items: flex-start;
  gap: .75rem;
}

.alert-success { background: rgba(16,185,129,.1);  border: 1px solid rgba(16,185,129,.3);  color: #6ee7b7; }
.alert-danger  { background: rgba(239,68,68,.1);   border: 1px solid rgba(239,68,68,.3);   color: #fca5a5; }
.alert-warning { background: rgba(245,158,11,.1);  border: 1px solid rgba(245,158,11,.3);  color: #fcd34d; }
.alert-info    { background: rgba(6,182,212,.1);   border: 1px solid rgba(6,182,212,.3);   color: #67e8f9; }

/* ── SPINNER ─────────────────────────────────────────────── */
.spinner {
  width: 20px; height: 20px;
  border: 2px solid var(--border2);
  border-top-color: var(--purple2);
  border-radius: 50%;
  animation: spin .7s linear infinite;
}

@keyframes spin { to { transform: rotate(360deg); } }

/* ── AUTH PAGES ──────────────────────────────────────────── */
.auth-page {
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 2rem;
}

.auth-card {
  width: 100%;
  max-width: 420px;
  background: rgba(10,10,24,.9);
  border: 1px solid var(--border);
  border-radius: 20px;
  padding: 2.5rem;
  backdrop-filter: blur(20px);
}

.auth-logo {
  text-align: center;
  margin-bottom: 2rem;
}

.auth-title {
  font-family: 'Orbitron', sans-serif;
  font-size: 1.6rem;
  font-weight: 900;
  background: linear-gradient(135deg, var(--purple2), var(--cyan));
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  letter-spacing: .04em;
}

.auth-sub {
  color: var(--text3);
  font-size: .8rem;
  margin-top: .25rem;
}

.divider {
  height: 1px;
  background: var(--border);
  margin: 1.5rem 0;
}

/* ── PAGINATION ──────────────────────────────────────────── */
.pagination {
  display: flex;
  gap: .4rem;
  margin-top: 1.5rem;
  justify-content: center;
}

.page-btn {
  padding: .4rem .75rem;
  border-radius: var(--radius-sm);
  font-size: .8rem;
  border: 1px solid var(--border);
  color: var(--text2);
  text-decoration: none;
  background: var(--glass);
  transition: all .2s;
}

.page-btn:hover, .page-btn.active {
  background: rgba(124,58,237,.2);
  border-color: var(--purple);
  color: var(--purple2);
}

/* ── TIER CARDS ──────────────────────────────────────────── */
.tier-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
  gap: 1rem;
}

.tier-card {
  background: var(--glass);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 1.5rem;
  text-align: center;
  transition: all .2s;
  cursor: pointer;
  position: relative;
}

.tier-card.selected,
.tier-card:hover {
  border-color: var(--purple);
  box-shadow: 0 0 20px rgba(124,58,237,.2);
  transform: translateY(-3px);
}

.tier-name {
  font-family: 'Orbitron', sans-serif;
  font-size: 1rem;
  font-weight: 700;
  margin-bottom: .5rem;
}

.tier-price {
  font-size: 1.8rem;
  font-weight: 700;
  background: linear-gradient(135deg, var(--purple2), var(--cyan));
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  line-height: 1;
}

.tier-price-sub {
  font-size: .75rem;
  color: var(--text3);
  margin-bottom: 1rem;
}

.tier-feature {
  font-size: .78rem;
  color: var(--text2);
  padding: .2rem 0;
}

/* ── RESULT META ─────────────────────────────────────────── */
.result-meta {
  display: flex;
  gap: 1.5rem;
  flex-wrap: wrap;
  margin-bottom: 1.5rem;
  padding: 1rem 1.25rem;
  background: var(--glass);
  border: 1px solid var(--border);
  border-radius: var(--radius);
}

.result-meta-item {
  display: flex;
  flex-direction: column;
}

.result-meta-label {
  font-size: .65rem;
  text-transform: uppercase;
  letter-spacing: .1em;
  color: var(--text3);
  margin-bottom: .1rem;
}

.result-meta-value {
  font-family: 'Orbitron', sans-serif;
  font-size: .95rem;
  font-weight: 600;
  color: var(--cyan2);
}

/* ── EXPORT BAR ──────────────────────────────────────────── */
.export-bar {
  display: flex;
  gap: .75rem;
  flex-wrap: wrap;
  margin-bottom: 1.5rem;
  padding: 1rem 1.25rem;
  background: var(--glass);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  align-items: center;
}

.export-bar-label {
  font-size: .78rem;
  color: var(--text3);
  margin-right: .25rem;
}

/* ── PROGRESS BAR ────────────────────────────────────────── */
.progress-wrap {
  background: var(--glass2);
  border-radius: 99px;
  height: 6px;
  margin-top: .5rem;
  overflow: hidden;
}

.progress-bar {
  height: 100%;
  border-radius: 99px;
  background: linear-gradient(90deg, var(--purple), var(--cyan));
  transition: width .4s ease;
}

/* ── MOBILE ──────────────────────────────────────────────── */
.mobile-toggle {
  display: none;
  position: fixed;
  top: 1rem; left: 1rem;
  z-index: 200;
  background: var(--glass2);
  border: 1px solid var(--border2);
  color: var(--text);
  padding: .5rem .75rem;
  border-radius: var(--radius-sm);
  cursor: pointer;
  font-size: 1rem;
}

@media (max-width: 768px) {
  .app-layout { grid-template-columns: 1fr; }

  .sidebar {
    transform: translateX(-100%);
    transition: transform .3s;
  }

  .sidebar.open { transform: translateX(0); }

  .mobile-toggle { display: block; }

  .main-content { padding: 1rem 1rem 1rem 1rem; margin-top: 3.5rem; }

  .stats-grid { grid-template-columns: repeat(2, 1fr); }

  .record-card { grid-template-columns: 1fr; }

  .search-form { flex-direction: column; }
}

/* ── UTILS ───────────────────────────────────────────────── */
.text-muted     { color: var(--text3); }
.text-purple    { color: var(--purple2); }
.text-cyan      { color: var(--cyan2); }
.text-green     { color: var(--green); }
.text-red       { color: var(--red); }
.text-yellow    { color: var(--yellow); }
.font-mono      { font-family: monospace; }
.font-orbitron  { font-family: 'Orbitron', sans-serif; }
.mt-1 { margin-top: .5rem; }
.mt-2 { margin-top: 1rem; }
.mt-3 { margin-top: 1.5rem; }
.mb-1 { margin-bottom: .5rem; }
.mb-2 { margin-bottom: 1rem; }
.flex { display: flex; }
.items-center { align-items: center; }
.justify-between { justify-content: space-between; }
.gap-2 { gap: .5rem; }
.gap-3 { gap: .75rem; }
.w-full { width: 100%; }
.hidden { display: none; }
  </style>
</head>
<body>
<div class="auth-page">
  <div class="auth-card">
    <div class="auth-logo">
      <div class="auth-title"><i class="fa fa-crosshairs"></i> {{ config.SITE_NAME }}</div>
      <div class="auth-sub">{{ config.VERSION }} · by {{ config.DEVELOPER }}</div>
    </div>

    {% with messages = get_flashed_messages(with_categories=true) %}
      {% for cat, msg in messages %}
        <div class="alert alert-{{ 'danger' if cat == 'error' else cat }}">
          <span>{{ msg }}</span>
        </div>
      {% endfor %}
    {% endwith %}

    {% block content %}{% endblock %}
  </div>
</div>
<script src="{{ url_for('static', filename='js/main.js') }}"></script>
</body>
</html>
